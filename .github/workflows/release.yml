name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.6
      - name: Prepare repository-bound curl installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          sed "s|__OUR_RUNNER_RELEASE_REPOSITORY__|${GITHUB_REPOSITORY}|g" \
            packaging/bootstrap.sh > .release/install.sh
          chmod 0755 .release/install.sh
          if grep -q '__OUR_RUNNER_RELEASE_REPOSITORY__' .release/install.sh; then
            echo "installer repository token was not replaced" >&2
            exit 1
          fi
          sh -n .release/install.sh
      - name: Build, sign, and draft release
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
