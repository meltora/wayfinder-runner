name: Signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; release only tested main commits" >&2
            exit 1
          }
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.6
      - name: Install Syft
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/anchore/syft/cmd/syft@v1.52.0
      - name: Select the release channel and its control plane
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DEVELOP_URL: ${{ vars.OUR_RUNNER_CONTROL_PLANE_URL_DEVELOP }}
          STAGING_URL: ${{ vars.OUR_RUNNER_CONTROL_PLANE_URL_STAGING }}
          PRODUCTION_URL: ${{ vars.OUR_RUNNER_CONTROL_PLANE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=production
            url=$PRODUCTION_URL
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-staging\.[0-9]+$ ]]; then
            channel=staging
            url=$STAGING_URL
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-develop\.[0-9]+$ ]]; then
            channel=develop
            url=$DEVELOP_URL
          else
            echo "tag $TAG is not vX.Y.Z, vX.Y.Z-staging.N or vX.Y.Z-develop.N" >&2
            exit 1
          fi
          if [[ -n "$url" && ! "$url" =~ ^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?/?$ ]]; then
            echo "the $channel control-plane URL variable is not an HTTPS origin" >&2
            exit 1
          fi
          echo "OUR_RUNNER_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "OUR_RUNNER_CONTROL_PLANE_URL=$url" >> "$GITHUB_ENV"
          echo "Channel $channel, default control plane: ${url:-none (enroll requires --url)}" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the tag, declared release version and update trust before publishing anything
        env:
          OUR_RUNNER_RELEASE_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: sh packaging/scripts/prepare-release.sh "$TAG" false preflight
      - name: Refuse a tag that already has a release or a job image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          name=$(printf '%s' "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')
          repository="ghcr.io/$owner/$name-job"
          sh packaging/scripts/refuse-published-tag.sh "$TAG" "$repository"
          echo "JOB_IMAGE_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - name: Run the format, vet and test gates on the tagged commit
        run: sh scripts/check.sh format vet test
      - name: Run packaging tests
        run: |
          sh packaging/tests/prepare_release_test.sh
          sh packaging/tests/published_tag_test.sh
          sh packaging/tests/bootstrap_test.sh
          sh packaging/tests/systemd_test.sh
          sh packaging/tests/release_artifacts_fixture_test.sh
          sh packaging/tests/fresh_host_doctor_test.sh
      - name: Build, push, sign and verify the job image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$JOB_IMAGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]] || { echo "the job image repository was not checked" >&2; exit 1; }
          image="$JOB_IMAGE_REPOSITORY:$TAG"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          sh packaging/job-image/build.sh "$image" --push | tee job-image.log
          pinned=$(sed -n 's/^pinned: //p' job-image.log)
          [[ "$pinned" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || { echo "the job image has no pinned digest" >&2; exit 1; }
          cosign sign --yes "$pinned"
          cosign verify "$pinned" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          mkdir -p .release
          printf '%s\n' "$pinned" > .release/job-image.txt
          echo "Job image: \`$pinned\` (set RUNNER_DEFAULT_JOB_IMAGE to this value)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build, sign, and draft release
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUR_RUNNER_RELEASE_REPOSITORY: ${{ github.repository }}
      - name: Check release artifacts
        run: sh packaging/tests/release_artifacts_test.sh
