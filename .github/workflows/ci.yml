name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Coverage gate
        shell: bash
        run: |
          set -euo pipefail
          go test -coverpkg=./... -coverprofile=coverage.out ./...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v actual="$coverage" 'BEGIN { if (actual + 0 < 80) { printf "coverage %.1f%% is below 80%%\n", actual; exit 1 } }'
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Security static analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...
      - name: Shell syntax
        run: >-
          sh -n packaging/bootstrap.sh packaging/install.sh
          packaging/scripts/preinstall.sh packaging/scripts/postinstall.sh
          packaging/tests/bootstrap_test.sh
      - name: Curl installer security tests
        run: sh packaging/tests/bootstrap_test.sh
      - name: Prepare release installer fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          sed 's|__OUR_RUNNER_RELEASE_REPOSITORY__|example/app-runner|g' \
            packaging/bootstrap.sh > .release/install.sh
          chmod 0755 .release/install.sh
          sh -n .release/install.sh
      - name: GoReleaser configuration
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
      - name: Build release artifact snapshot
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish,sign,sbom
      - name: Validate release artifact boundaries
        run: sh packaging/tests/release_artifacts_test.sh

  job-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Linux runner for the job image
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/our-runner-linux ./cmd/our-runner
      - name: Build job image
        run: docker build --pull --tag our-runner-job:ci --file packaging/job-image/Dockerfile .
      - name: Verify nested sandbox and synthetic credential denial
        env:
          RUN_DOCKER_SANDBOX_PROBE: "1"
          JOB_IMAGE: our-runner-job:ci
        run: go test -count=1 -run TestNestedSandboxContainerIntegration ./internal/isolation
      - name: Scan job image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: our-runner-job:ci
          version: v0.70.0
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
