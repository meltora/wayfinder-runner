name: Promote signed update

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, canary]
      sequence:
        description: Monotonically increasing channel sequence
        required: true
        type: string
      min_runner:
        description: Oldest runner allowed to consume this update
        required: true
        default: 0.0.0
        type: string
      min_updater:
        description: Oldest privileged updater allowed to consume this update
        required: true
        default: 0.0.0
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-update-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify, sign, and promote
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: update-production
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      UPDATE_CHANNEL: ${{ inputs.channel }}
      UPDATE_SEQUENCE: ${{ inputs.sequence }}
      MIN_RUNNER: ${{ inputs.min_runner }}
      MIN_UPDATER: ${{ inputs.min_updater }}
      UPDATE_BUCKET: ${{ vars.UPDATE_BUCKET }}
      UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
      UPDATE_KMS_KEY_ID_PRIMARY: ${{ vars.UPDATE_KMS_KEY_ID_PRIMARY }}
      UPDATE_SIGNING_KEY_ID_PRIMARY: ${{ vars.UPDATE_SIGNING_KEY_ID_PRIMARY }}
      UPDATE_KMS_KEY_ID_SECONDARY: ${{ vars.UPDATE_KMS_KEY_ID_SECONDARY }}
      UPDATE_SIGNING_KEY_ID_SECONDARY: ${{ vars.UPDATE_SIGNING_KEY_ID_SECONDARY }}
    steps:
      - name: Check out trusted promotion tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Never execute repository code from the release tag being promoted.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.6

      - name: Acquire short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v5.1.0
        with:
          role-to-assume: ${{ vars.UPDATE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.UPDATE_AWS_REGION }}

      - name: Validate promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "release_tag must be a canonical v-prefixed semantic version without build metadata" >&2
            exit 1
          }
          (( ${#RELEASE_TAG} <= 64 && ${#MIN_RUNNER} <= 64 && ${#MIN_UPDATER} <= 64 )) || {
            echo "version inputs are too long" >&2
            exit 1
          }
          [[ "$UPDATE_SEQUENCE" =~ ^[1-9][0-9]*$ ]] || {
            echo "sequence must be a positive integer" >&2
            exit 1
          }
          (( ${#UPDATE_SEQUENCE} <= 15 )) || {
            echo "sequence is too large for the JSON publishing toolchain" >&2
            exit 1
          }
          [[ "$MIN_RUNNER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          [[ "$MIN_UPDATER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          [[ -n "$UPDATE_BUCKET" && -n "$UPDATE_KMS_KEY_ID_PRIMARY" && -n "$UPDATE_SIGNING_KEY_ID_PRIMARY" ]] || {
            echo "the protected environment is missing required update publishing variables" >&2
            exit 1
          }
          [[ "$UPDATE_PUBLIC_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] || {
            echo "UPDATE_PUBLIC_BASE_URL must be a credential-free HTTPS origin without a path" >&2
            exit 1
          }
          if [[ -n "$UPDATE_KMS_KEY_ID_SECONDARY" || -n "$UPDATE_SIGNING_KEY_ID_SECONDARY" ]]; then
            [[ -n "$UPDATE_KMS_KEY_ID_SECONDARY" && -n "$UPDATE_SIGNING_KEY_ID_SECONDARY" ]] || {
              echo "secondary KMS key and signing key ID must be configured together" >&2
              exit 1
            }
          fi

      - name: Download and verify published release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .promotion/release
          version="${RELEASE_TAG#v}"
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)"
          [[ "$(jq -r .tagName <<<"$release_json")" == "$RELEASE_TAG" ]] || exit 1
          [[ "$(jq -r .isDraft <<<"$release_json")" == false ]] || {
            echo "the release must be published before promotion" >&2
            exit 1
          }
          assets=(
            checksums.txt
            checksums.txt.sigstore.json
            "our-runner-update_${version}_linux_amd64.tar.gz"
            "our-runner-update_${version}_linux_arm64.tar.gz"
          )
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --dir .promotion/release --pattern "$asset"
          done
          cosign verify-blob \
            --bundle .promotion/release/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            .promotion/release/checksums.txt
          for arch in amd64 arm64; do
            archive="our-runner-update_${version}_linux_${arch}.tar.gz"
            expected="$(awk -v file="$archive" '$2 == file || $2 == "*" file {print $1}' .promotion/release/checksums.txt)"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || {
              echo "signed checksums contain no unique SHA-256 for $archive" >&2
              exit 1
            }
            actual="$(sha256sum ".promotion/release/$archive" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || {
              echo "release checksum mismatch for $archive" >&2
              exit 1
            }
          done

      - name: Publish immutable update artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for arch in amd64 arm64; do
            archive="our-runner-update_${version}_linux_${arch}.tar.gz"
            path=".promotion/release/$archive"
            key="updates/artifacts/${RELEASE_TAG}/${archive}"
            digest="$(sha256sum "$path" | awk '{print $1}')"
            size="$(stat -c %s "$path")"
            metadata=""
            if metadata="$(aws s3api head-object --bucket "$UPDATE_BUCKET" --key "$key" 2>.promotion/head-artifact.err)"; then
              remote_size="$(jq -er .ContentLength <<<"$metadata")"
              remote_digest="$(jq -er '.Metadata.sha256' <<<"$metadata")"
              [[ "$remote_size" == "$size" && "$remote_digest" == "$digest" ]] || {
                echo "immutable artifact key already contains different content: $key" >&2
                exit 1
              }
              continue
            elif ! grep -Eq 'Not Found|404|NoSuchKey' .promotion/head-artifact.err; then
              cat .promotion/head-artifact.err >&2
              exit 1
            fi
            if ! aws s3api put-object \
                --bucket "$UPDATE_BUCKET" --key "$key" --body "$path" \
                --content-type application/gzip \
                --cache-control 'public,max-age=31536000,immutable' \
                --metadata "sha256=$digest" --if-none-match '*' >/dev/null; then
              # A concurrent channel promotion may have won the conditional
              # write. It is safe only when it stored the identical object.
              metadata="$(aws s3api head-object --bucket "$UPDATE_BUCKET" --key "$key")"
              [[ "$(jq -er .ContentLength <<<"$metadata")" == "$size" ]]
              [[ "$(jq -er '.Metadata.sha256' <<<"$metadata")" == "$digest" ]]
            fi
          done

      - name: Generate canonical update payload
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_id="${RELEASE_TAG}-${UPDATE_CHANNEL}-${UPDATE_SEQUENCE}"
          issued_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          expires_at="$(date -u -d '+144 hours' +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "$version" \
            --arg root "$PWD/.promotion/release" \
            '["amd64", "arm64"] | map({
              name: ("our-runner-update_" + $version + "_linux_" + . + ".tar.gz"),
              path: ($root + "/our-runner-update_" + $version + "_linux_" + . + ".tar.gz"),
              type: "Archive",
              goos: "linux",
              goarch: .,
              extra: {
                Format: "tar.gz",
                ID: "linux-update",
                Checksum: ""
              }
            })' > .promotion/artifacts.template.json
          # GoReleaser records contain their own digest; populate it from the
          # already verified local archives without evaluating generated shell.
          jq -c '.[]' .promotion/artifacts.template.json | while IFS= read -r record; do
            path="$(jq -r .path <<<"$record")"
            digest="$(sha256sum "$path" | awk '{print $1}')"
            jq --arg checksum "sha256:$digest" '.extra.Checksum = $checksum' <<<"$record"
          done | jq -s . > .promotion/artifacts.json
          go run ./cmd/update-manifest generate \
            --artifacts .promotion/artifacts.json \
            --dist .promotion/release \
            --base-url "${UPDATE_PUBLIC_BASE_URL%/}/updates/artifacts/${RELEASE_TAG}" \
            --channel "$UPDATE_CHANNEL" \
            --sequence "$UPDATE_SEQUENCE" \
            --release-id "$release_id" \
            --version "$version" \
            --issued-at "$issued_at" \
            --expires-at "$expires_at" \
            --min-runner "$MIN_RUNNER" \
            --min-updater "$MIN_UPDATER" \
            --payload-out .promotion/payload.json \
            --digest-out .promotion/digest.bin

      - name: Sign payload digest with KMS
        shell: bash
        run: |
          set -euo pipefail
          sign_and_verify() {
            local kms_key="$1" output_prefix="$2"
            aws kms sign \
              --key-id "$kms_key" \
              --message fileb://.promotion/digest.bin \
              --message-type DIGEST \
              --signing-algorithm ECDSA_SHA_256 \
              --output json > ".promotion/${output_prefix}.json"
            jq -er .Signature ".promotion/${output_prefix}.json" > ".promotion/${output_prefix}.b64"
            base64 --decode ".promotion/${output_prefix}.b64" > ".promotion/${output_prefix}.der"
            aws kms verify \
              --key-id "$kms_key" \
              --message fileb://.promotion/digest.bin \
              --message-type DIGEST \
              --signing-algorithm ECDSA_SHA_256 \
              --signature "fileb://.promotion/${output_prefix}.der" \
              --query SignatureValid --output text | grep -qx True
          }
          sign_and_verify "$UPDATE_KMS_KEY_ID_PRIMARY" primary
          assemble=(go run ./cmd/update-manifest assemble
            --payload .promotion/payload.json
            --output .promotion/manifest.json
            --signature "$UPDATE_SIGNING_KEY_ID_PRIMARY=.promotion/primary.b64")
          if [[ -n "$UPDATE_KMS_KEY_ID_SECONDARY" ]]; then
            sign_and_verify "$UPDATE_KMS_KEY_ID_SECONDARY" secondary
            assemble+=(--signature "$UPDATE_SIGNING_KEY_ID_SECONDARY=.promotion/secondary.b64")
          fi
          "${assemble[@]}"

      - name: Publish immutable manifest then advance channel pointer
        shell: bash
        run: |
          set -euo pipefail
          immutable_key="updates/${UPDATE_CHANNEL}/${UPDATE_SEQUENCE}.json"
          pointer_key="updates/${UPDATE_CHANNEL}/manifest.json"
          current_meta=""
          if current_meta="$(aws s3api get-object \
              --bucket "$UPDATE_BUCKET" --key "$pointer_key" \
              .promotion/current.json 2>.promotion/get-current.err)"; then
            current_sequence="$(jq -er .payload .promotion/current.json | base64 --decode | jq -er .sequence)"
            [[ "$current_sequence" =~ ^[1-9][0-9]*$ ]] || exit 1
            if (( UPDATE_SEQUENCE == current_sequence )); then
              cmp -s .promotion/current.json .promotion/manifest.json || {
                echo "sequence $UPDATE_SEQUENCE is already published with different content" >&2
                exit 1
              }
              echo "sequence $UPDATE_SEQUENCE is already the current identical manifest"
              exit 0
            fi
            (( UPDATE_SEQUENCE > current_sequence )) || {
              echo "sequence $UPDATE_SEQUENCE does not advance current sequence $current_sequence" >&2
              exit 1
            }
          elif ! grep -Eq 'NoSuchKey|Not Found|404' .promotion/get-current.err; then
            cat .promotion/get-current.err >&2
            exit 1
          fi
          if ! aws s3api put-object \
              --bucket "$UPDATE_BUCKET" --key "$immutable_key" \
              --body .promotion/manifest.json \
              --content-type application/json \
              --cache-control 'public,max-age=31536000,immutable' \
              --if-none-match '*' >/dev/null; then
            # A retry after a pointer-update failure is safe only if the
            # immutable sequence object is byte-for-byte identical.
            aws s3api get-object --bucket "$UPDATE_BUCKET" --key "$immutable_key" \
              .promotion/existing-manifest.json >/dev/null
            cmp -s .promotion/existing-manifest.json .promotion/manifest.json || {
              echo "immutable sequence $UPDATE_SEQUENCE already contains different content" >&2
              exit 1
            }
          fi
          pointer_args=(
            --bucket "$UPDATE_BUCKET" --key "$pointer_key"
            --body .promotion/manifest.json
            --content-type application/json
            --cache-control 'public,max-age=60,must-revalidate'
          )
          if [[ -n "$current_meta" ]]; then
            current_etag="$(jq -er .ETag <<<"$current_meta")"
            pointer_args+=(--if-match "$current_etag")
          else
            pointer_args+=(--if-none-match '*')
          fi
          aws s3api put-object "${pointer_args[@]}" >/dev/null
