control_plane_url: wss://control-plane.example.com/v1/runners/stream
state_dir: /var/lib/our-runner
transport: websocket
isolation: docker
supervisor: auto
provider: codex
# OpenCode is a provider-neutral harness. To use it, set provider: opencode.
# agent_model is optional; when omitted, OpenCode uses the customer's imported
# or global default. When set, it must be an OpenCode provider/model identifier.
# agent_model: customer-provider/customer-model
job_image: registry.example.com/our-runner/job@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
job_memory_mb: 4096
job_cpus: 2
job_pids: 512
artifact_spool_mb: 1024
journal_retention_days: 30
journal_max_mb: 512
job_network: none
# Cloud-backed Codex/Claude jobs require a pre-created, egress-enforced Docker
# network labeled com.ourplatform.egress-enforced=true and
# com.ourplatform.egress-policy=<policy ID>:
# job_network: restricted
# job_network_name: runner-egress
# egress_policy_id: provider-git-v1
# With `our-runner configure`, the dashboard delivers job_network,
# job_network_name and egress_policy_id; a runner build without that support
# rejects such a delivered document. Labels are checked at start, but they are
# not proof that egress is enforced on the host.
# Prompt-only work-intake consultation additionally requires a root-owned
# effective-policy lease agent on Linux. It must exclusively pin the applicable
# host firewall/proxy rules while each authenticated lease connection is open;
# Docker labels are not treated as proof that enforcement is still active.
# egress_policy_verifier_socket: /run/our-runner-egress/policy.sock
labels:
  pool: default

# Exact administrator-trusted Ed25519 public keys. Values are canonical base64
# of SubjectPublicKeyInfo DER, not raw 32-byte keys or certificates.
# agent_pack_public_keys:
#   platform-2026-01: <base64-ed25519-spki-der>

# When omitted, Agent Pack downloads are restricted to the control-plane HTTPS
# origin. Add only canonical HTTPS origins when artifacts use a separate host.
# allowed_artifact_origins:
#   - https://packs.example.com

# Repository URLs are installed by an administrator and referenced by opaque ID
# in control-plane job specifications. Never place credentials in these URLs.
# GitHub repositories use an HTTPS URL; the platform's GitHub App installation
# token, attached per command, provides read and push access. Other hosts use
# the runner user's Git credential helper or SSH agent.
# repositories:
#   web-app:
#     url: https://github.com/company/web-app.git
#   internal-tools:
#     url: ssh://git@example.com/company/internal-tools.git
#   shared-api:
#     url: https://example.com/company/shared-api.git

# Checks are administrator-owned argv arrays, not control-plane shell strings.
# checks:
#   web-unit:
#     command: npm
#     args: [test, --, --runInBand]
#     timeout_seconds: 900
#     repository_id: web-app
#     # Git-ignored directories carried into the published check workspace.
#     # Omit for [node_modules]; [] carries none.
#     dependency_directories: [node_modules]

# Preview observation is a daemon-owned HTTPS operation, never an agent-provided
# request. The blueprint identity and complete health-check inventory must match
# the control-plane execution manifest. Host suffixes and paths stay local.
# Private addresses require exact RFC1918/ULA CIDRs. Loopback and link-local
# addresses are always denied. The optional authorization file contains the
# complete Authorization header value and must be a private regular file.
# preview_observation_profiles:
#   node-web-preview:
#     blueprint_id: node-web-app
#     version: "2026.08.20"
#     digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
#     allowed_hostname_suffixes: [preview.example.com]
#     allowed_private_cidrs: [10.40.0.0/16]
#     trusted_ca_file: /etc/our-runner/preview-root-ca.pem
#     authorization_file: /run/secrets/our-runner/preview-authorization
#     max_response_bytes: 65536
#     health_checks:
#       http-smoke:
#         path: /healthz
#         expected_status: [200]
#         timeout_seconds: 10

# Preview lifecycle mutation is a separate daemon capability. Each controller
# is fixed in runner-local configuration and bound to one exact blueprint.
# Commands can select only that blueprint and an advertised action; they cannot
# supply endpoints, headers, credentials, CA roots, or arbitrary methods.
# The authorization file contains the complete Authorization header value.
# max_extension_ms is required when extend is enabled and may not exceed 30d.
# preview_lifecycle_controllers:
#   node-web-preview:
#     blueprint_id: node-web-app
#     version: "2026.08.20"
#     digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
#     controller_url: https://preview-controller.example.com/v1/preview-lifecycle
#     trusted_ca_file: /etc/our-runner/preview-controller-root-ca.pem
#     authorization_file: /run/secrets/our-runner/preview-controller-authorization
#     actions: [destroy, extend]
#     max_extension_ms: 2592000000
#     timeout_seconds: 20
#     max_response_bytes: 65536
